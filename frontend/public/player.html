<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV Video Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
    video-stream, video-rtc {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      position: absolute !important;
      inset: 0 !important;
      background: #000000 !important;
    }
    video-stream video, video-rtc video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      background: #000000 !important;
    }
    .fit-cover video {
      object-fit: cover !important;
    }
    /* Ocultar completamente textos, códigos y banners de error internos de go2rtc */
    .info, .status, .mode, div.info, div.status, div.mode {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <script type="module">
    import { VideoRTC } from './video-rtc.js';

    if (!customElements.get('video-rtc')) {
      customElements.define('video-rtc', VideoRTC);
    }

    const params = new URLSearchParams(location.search);
    const src = params.get('src') || '';
    const isMuted = params.get('muted') !== '0';
    const fit = params.get('fit') || 'contain';
    const host = window.location.hostname || 'localhost';

    const rtc = document.createElement('video-rtc');
    if (fit === 'cover') {
      rtc.classList.add('fit-cover');
    }
    
    // Control estricto de pistas: si está silenciado, solo pedir video
    const mediaMode = isMuted ? 'video' : 'video,audio';
    rtc.media = mediaMode;
    rtc.mode = 'webrtc,mse,mp4,mjpeg';
    rtc.background = true;
    
    // 1. Agregar primero al DOM para inicializar el CustomElement
    document.body.appendChild(rtc);

    // 2. Asignar src después de montar para que el ciclo de conexión sea limpio
    rtc.src = `ws://${host}:1984/api/ws?src=${encodeURIComponent(src)}`;

    // Aplicar muting nativo irrompible al elemento video si isMuted es true
    const enforceMute = () => {
      if (rtc.video) {
        rtc.video.muted = isMuted;
        rtc.video.volume = isMuted ? 0 : 1;
        if (isMuted) {
          rtc.video.setAttribute('muted', '');
          rtc.video.onvolumechange = () => {
            if (!rtc.video.muted || rtc.video.volume > 0) {
              rtc.video.muted = true;
              rtc.video.volume = 0;
            }
          };
        } else {
          rtc.video.removeAttribute('muted');
        }
        rtc.video.playsInline = true;
        rtc.video.play().catch(() => {});
      }
    };
    
    enforceMute();
    setTimeout(enforceMute, 50);
    setTimeout(enforceMute, 200);
    setTimeout(enforceMute, 600);
    setTimeout(enforceMute, 1500);

    // Auto-reintento suave si la cámara corta la conexión temporalmente
    setInterval(() => {
      if (rtc && rtc.wsState === WebSocket.CLOSED && rtc.pcState === WebSocket.CLOSED) {
        try { rtc.onconnect(); } catch (e) {}
      }
    }, 5000);
  </script>
</body>
</html>
