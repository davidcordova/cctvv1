<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV Player (go2rtc)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    video-rtc {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      position: absolute !important;
      inset: 0 !important;
      background: #000000 !important;
    }
    video-rtc video {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      position: absolute !important;
      inset: 0 !important;
      object-fit: contain !important;
      background: #000000 !important;
    }
    .fit-cover video-rtc video {
      object-fit: cover !important;
    }
    video-rtc video::-webkit-media-controls,
    video-rtc video::-webkit-media-controls-enclosure,
    video-rtc video::-webkit-media-controls-panel {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }
    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-text {
      color: #9ca3af;
      font-family: monospace;
      font-size: 11px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Indicador Visual Flotante de Intercomunicador / Micrófono Activo */
    .talk-hud {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(220, 38, 38, 0.9);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 25;
      animation: pulseGlow 1.5s infinite alternate;
      pointer-events: none;
      backdrop-blur: 8px;
    }
    .wave-container {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 12px;
    }
    .wave-bar {
      width: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      animation: wave 0.8s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 8px; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 12px; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; height: 6px; }

    @keyframes wave {
      0% { height: 3px; }
      100% { height: 12px; }
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.4); transform: scale(1); }
      100% { box-shadow: 0 0 16px rgba(239, 68, 68, 0.8); transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <div id="loader" class="loader">
    <div class="spinner"></div>
    <span class="loader-text">Conectando señal...</span>
  </div>

  <div id="talk-hud" class="talk-hud hidden">
    <div class="wave-container">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <span>HABLANDO POR MICRÓFONO</span>
  </div>

  <script type="module">
    import { VideoRTC } from './video-rtc.js';
    if (!customElements.get('video-rtc')) {
      customElements.define('video-rtc', VideoRTC);
    }

    const params = new URLSearchParams(location.search);
    const src = params.get('src') || '';
    const isMuted = params.get('muted') !== '0';
    const isTalk = params.get('talk') === '1' || params.get('mic') === '1';
    const fit = params.get('fit') || 'contain';
    const host = window.location.hostname || 'localhost';

    if (fit === 'cover') {
      document.body.classList.add('fit-cover');
    }

    const loaderEl = document.getElementById('loader');
    const talkHudEl = document.getElementById('talk-hud');

    const hideLoader = () => {
      if (loaderEl) loaderEl.classList.add('hidden');
    };

    if (isTalk && talkHudEl) {
      talkHudEl.classList.remove('hidden');
    }

    let currentPlayer = null;

    if (src) {
      const player = document.createElement('video-rtc');
      currentPlayer = player;
      player.src = `ws://${host}:1984/api/ws?src=${encodeURIComponent(src)}`;
      player.mode = 'webrtc,mse,hls';
      player.media = isTalk ? 'video,audio,microphone' : 'video,audio';
      player.background = true;
      
      player.addEventListener('loadeddata', hideLoader);
      player.addEventListener('playing', hideLoader);
      player.addEventListener('canplay', hideLoader);

      document.body.appendChild(player);

      const enforceMute = () => {
        const v = player.querySelector('video');
        if (v) {
          v.muted = isMuted;
          v.defaultMuted = isMuted;
          v.volume = isMuted ? 0 : 1;
          if (isMuted) {
            v.setAttribute('muted', '');
          } else {
            v.removeAttribute('muted');
          }
          v.play().then(hideLoader).catch(() => {});
        }
      };

      const obs = new MutationObserver(() => {
        enforceMute();
      });
      obs.observe(player, { childList: true, subtree: true });

      setTimeout(enforceMute, 150);
      setTimeout(enforceMute, 600);
      setTimeout(hideLoader, 2000);
    }

    // Receptor de mensajes desde el contenedor padre (React)
    window.addEventListener('message', async (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'set_muted' && currentPlayer) {
        const v = currentPlayer.querySelector('video');
        if (v) {
          v.muted = Boolean(data.muted);
          v.volume = data.muted ? 0 : 1;
        }
      }

      if (data.type === 'start_talk' && currentPlayer) {
        if (talkHudEl) talkHudEl.classList.remove('hidden');
        if (typeof currentPlayer.startMicrophone === 'function') {
          await currentPlayer.startMicrophone();
        }
      }

      if (data.type === 'stop_talk' && currentPlayer) {
        if (talkHudEl) talkHudEl.classList.add('hidden');
        if (typeof currentPlayer.stopMicrophone === 'function') {
          currentPlayer.stopMicrophone();
        }
      }
    });
  </script>
</body>
</html>
